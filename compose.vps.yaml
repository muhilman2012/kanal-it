name: kanal-it
services:
  web:
    build: .
    restart: unless-stopped
    env_file: deploy.env
    ports:
      - "127.0.0.1:8102:80"
    networks:
      default: {}
      web-proxy:
        aliases:
          - kanal-it-web
    volumes:
      - data:/data
      - botstate:/var/www/html/storage/app/private/report-bot
    command: ["sh","-ec","umask 077; mkdir -p /data; touch /data/kanal.sqlite; printf '%s' \"$$REPORT_BOT_TOKEN\" > storage/app/private/report-bot/token; chown -R www-data:www-data /data storage/app/private/report-bot; su -s /bin/sh www-data -c 'php artisan migrate --force'; exec apache2-foreground"]
    healthcheck:
      test: ["CMD","php","-r","exit(@file_get_contents('http://localhost/up')===false?1:0);"]
      interval: 15s
      timeout: 5s
      retries: 10
  bot:
    build: ./bot
    init: true
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    environment:
      WA_NO_SANDBOX: "1"
      REPORT_ENDPOINT: http://web/api/laporan/masuk
    volumes:
      - botstate:/opt/kanal/storage/app/private/report-bot
    shm_size: 256mb
volumes:
  data:
  botstate:
networks:
  web-proxy:
    external: true
